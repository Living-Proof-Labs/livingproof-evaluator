# Requires uv, project Python, pyproject.toml, and uv.lock with Ruff/pytest in dev.
# Run directly in the prepared development/tooling environment, without Docker.
# For a Compose host wrapper, copy this file as Taskfile.runtime.yml.
# Pair tool help with generated reference; see docs/tool-usability.md at the
# same adopted guidelines version. The generated-docs fixture demonstrates Click.
version: "3"

tasks:
  setup:
    desc: Sync locked dependencies into the project environment
    cmds:
      - uv sync --locked --no-python-downloads
  check:
    desc: Check Python with locked Ruff
    cmds:
      - uv run --locked --no-sync --no-python-downloads ruff check .
      - uv run --locked --no-sync --no-python-downloads ruff format --check .
  test:
    desc: Run locked pytest
    cmds:
      - uv run --locked --no-sync --no-python-downloads python -c "import os; os.makedirs('artifacts', exist_ok=True)"
      - uv run --locked --no-sync --no-python-downloads pytest --junitxml=artifacts/tests.xml
  verify:
    desc: Run checks and tests
    cmds:
      - task: check
      - task: test
  manual:setup:
    desc: Install hash-locked manual tools in an isolated environment
    cmds:
      - uv venv --python 3.12 .venv-docs
      - uv pip sync --python .venv-docs/bin/python --require-hashes tools/manual/requirements.lock
  manual:build:
    desc: Build the branded contract manual and generated reference
    cmds:
      - .venv-docs/bin/python tools/manual/build.py
  manual:verify:
    desc: Check rendered links, source identity, brand, and browser navigation
    cmds:
      - .venv-docs/bin/python -m pytest tools/manual/tests -q --junitxml=artifacts/manual/tests.xml
