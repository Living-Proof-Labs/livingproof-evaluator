# SPDX-License-Identifier: Apache-2.0
name: Repository manual
on:
  workflow_call:
    inputs:
      version: {type: string, required: true}
      commit: {type: string, required: true}
      run: {type: string, required: true}
      attempt: {type: string, required: true}
    outputs:
      artifact-id:
        value: ${{ jobs.build.outputs.artifact-id }}
      digest:
        value: ${{ jobs.build.outputs.digest }}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.sealed.outputs.artifact-id }}
      digest: ${{ steps.seal.outputs.digest }}
    env:
      MANUAL_VERSION: ${{ inputs.version }}
      PLAN_COMMIT: ${{ inputs.commit }}
      PLAN_RUN: ${{ inputs.run }}
      PLAN_ATTEMPT: ${{ inputs.attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Require the exact planned source and build identity
        env:
          EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PLAN_COMMIT"
          test "$PLAN_COMMIT" = "$EXPECTED_SOURCE"
          test "$PLAN_RUN" = "$GITHUB_RUN_ID"
          test "$PLAN_ATTEMPT" = "$GITHUB_RUN_ATTEMPT"
          if [[ "$GITHUB_EVENT_NAME" != 'pull_request' || "$PR_BASE" == 'main' ]]; then
            test -n "$MANUAL_VERSION"
          fi
      - name: Require the existing immutable stable release before rebuilding
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPLAY_TAG: ${{ github.event.inputs.replay_tag }}
        run: |
          set -euo pipefail
          [[ "$MANUAL_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$REPLAY_TAG" = "v$MANUAL_VERSION"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$REPLAY_TAG" |
            python3 tools/manual/delivery.py published "$REPLAY_TAG"
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e
        with:
          version: '3.54.0'
      # No published tooling image: use the documented prepared-host fallback.
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
      - run: task manual:setup
      - run: .venv-docs/bin/python -m playwright install --with-deps chromium
      - run: task manual:build
      - run: task manual:verify
      - name: Publish individual manual checks
        id: tests
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@8861569aa5348397e7a26b6dda744c17c9265478
        with:
          name: Repository manual checks
          path: artifacts/manual/tests.xml
          reporter: java-junit
          use-actions-summary: 'true'
          list-tests: all
          fail-on-error: 'true'
          fail-on-empty: 'true'
      - name: Retain manual and diagnostics
        id: artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-manual-${{ github.run_attempt }}-${{ inputs.version || 'development' }}
          path: artifacts/manual/
          retention-days: 14
          if-no-files-found: error
      - name: Verify complete test publication
        if: ${{ !cancelled() }}
        env:
          PASSED: ${{ steps.tests.outputs.passed }}
          FAILED: ${{ steps.tests.outputs.failed }}
          SKIPPED: ${{ steps.tests.outputs.skipped }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          for count in "$PASSED" "$FAILED" "$SKIPPED"; do [[ $count =~ ^[0-9]+$ ]]; done
          emitted=$(grep -o '<testcase[[:space:]>]' artifacts/manual/tests.xml | wc -l)
          ingested=$((PASSED + FAILED + SKIPPED))
          echo "Individual cases: $ingested ingested / $emitted emitted" >> "$GITHUB_STEP_SUMMARY"
          echo "Manual and diagnostics (14 days): $ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          test "$emitted" -gt 0
          test "$emitted" -eq "$ingested"
      - name: Seal the exact tested manual
        id: seal
        if: inputs.version != ''
        run: |
          set -euo pipefail
          cd artifacts/manual/html
          test -f index.html
          test -z "$(find . ! -type f ! -type d -print -quit)"
          python3 ../../../tools/manual/delivery.py seal build.json "$MANUAL_VERSION" \
            "$PLAN_COMMIT" "$PLAN_RUN" "$PLAN_ATTEMPT"
          tar --dereference --hard-dereference -cf "$RUNNER_TEMP/artifact.tar" .
          digest=$(sha256sum "$RUNNER_TEMP/artifact.tar")
          echo "digest=${digest%% *}" >> "$GITHUB_OUTPUT"
      - name: Retain the sealed manual for this run
        id: sealed
        if: inputs.version != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evaluator-sealed-${{ github.run_attempt }}-${{ inputs.version }}
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 14
          if-no-files-found: error
