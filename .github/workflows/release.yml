# SPDX-License-Identifier: Apache-2.0
name: Release
on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  release:
    # The pinned semantic-release.yml analyzes conventional commits, then tags
    # v${version} and publishes a GitHub release. It does not write a version
    # into pyproject.toml. With no tag on main, semantic-release 25.0.9
    # publishes its FIRST_RELEASE, 1.0.0, for every release type.
    # workflow_run uses the default-branch tip as github.sha. Skip a stale Verify
    # completion; the newer verified tip can batch the unreleased commits.
    # The shared checkout defaults to GITHUB_SHA, and its runner asserts HEAD
    # equals GITHUB_SHA before publishing. Its concurrency never cancels a release.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_sha == github.sha
    permissions:
      contents: write
    uses: Living-Proof-Labs/collaboration-guidelines/.github/workflows/semantic-release.yml@20aa7f98e8e7712f194d72a5f5ea5f0941cff6ac # v9.7.6
