# SPDX-License-Identifier: Apache-2.0
name: Deploy released evaluator manual
on:
  workflow_call:
    inputs:
      release_tag: {type: string, required: true}
      version: {type: string, required: true}
      commit: {type: string, required: true}
      run: {type: string, required: true}
      attempt: {type: string, required: true}
      artifact_id: {type: string, required: true}
      digest: {type: string, required: true}
permissions:
  contents: read
jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' &&
        github.event.inputs.replay_tag != '' &&
        github.event.inputs.replay_tag == inputs.release_tag))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: evaluator-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      VERSION: ${{ inputs.version }}
      SOURCE: ${{ inputs.commit }}
      PLAN_RUN: ${{ inputs.run }}
      PLAN_ATTEMPT: ${{ inputs.attempt }}
      ARTIFACT_ID: ${{ inputs.artifact_id }}
      DIGEST: ${{ inputs.digest }}
      REPLAY_TAG: ${{ github.event.inputs.replay_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Require exact published stable tag and same-run build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PLAN_ATTEMPT" =~ ^[1-9][0-9]{0,5}$ ]]
          test "$PLAN_ATTEMPT" -le "$GITHUB_RUN_ATTEMPT"
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            test "$PLAN_ATTEMPT" = "$GITHUB_RUN_ATTEMPT"
            test "$REPLAY_TAG" = "$RELEASE_TAG"
          fi
          test "$RELEASE_TAG" = "v$VERSION"
          test "$SOURCE" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test "$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")" = "$SOURCE"
          test "$PLAN_RUN" = "$GITHUB_RUN_ID"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" |
            python3 tools/manual/delivery.py published "$RELEASE_TAG"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          path: ${{ runner.temp }}/verified-evaluator
          merge-multiple: true
      - name: Use the exact sealed bytes and validate their build identity
        id: pages-package
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^[0-9a-f]{64}$ ]]
          archive="$RUNNER_TEMP/verified-evaluator/artifact.tar"
          printf '%s  %s\n' "$DIGEST" "$archive" | sha256sum --check
          python3 tools/manual/delivery.py archive "$archive" "$VERSION" "$SOURCE" "$PLAN_RUN" "$PLAN_ATTEMPT"
          cp "$archive" "$RUNNER_TEMP/artifact.tar"
          echo "tar-sha256=$DIGEST" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: pages-artifact
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      # Use the same-run Actions artifact client (like deploy-pages), not the REST index.
      # An exact ID and name must both resolve to the sealed Pages tar before deploying.
      - name: Require a valid Pages artifact ID
        shell: bash
        env:
          UPLOADED_ID: ${{ steps.pages-artifact.outputs.artifact-id }}
        run: |
          [[ "$UPLOADED_ID" =~ ^[1-9][0-9]*$ ]]
      - name: Read exact Pages artifact by ID
        id: pages-id-first
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.pages-artifact.outputs.artifact-id }}
          path: ${{ runner.temp }}/evaluator-pages-id-first
      - name: Allow the ID lookup to settle
        if: steps.pages-id-first.outcome == 'failure'
        run: sleep 4
      - name: Retry read by ID once
        id: pages-id-retry
        if: steps.pages-id-first.outcome == 'failure'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.pages-artifact.outputs.artifact-id }}
          path: ${{ runner.temp }}/evaluator-pages-id-retry
      - name: Read exact Pages artifact by name
        id: pages-name-first
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evaluator-pages-name-first
      - name: Allow the name lookup to settle
        if: steps.pages-name-first.outcome == 'failure'
        run: sleep 4
      - name: Retry read by name once
        id: pages-name-retry
        if: steps.pages-name-first.outcome == 'failure'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evaluator-pages-name-retry
      - name: Require matching ID and name readback of the exact tar
        shell: bash
        env:
          EXPECTED_TAR: ${{ steps.pages-package.outputs.tar-sha256 }}
          EXPECTED_NAME: github-pages-${{ github.run_attempt }}
          ID_READBACK: ${{ steps.pages-id-first.outcome == 'success' && steps.pages-id-first.outputs.download-path || steps.pages-id-retry.outputs.download-path }}
          NAME_READBACK: ${{ steps.pages-name-first.outcome == 'success' && steps.pages-name-first.outputs.download-path || steps.pages-name-retry.outputs.download-path }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_TAR" =~ ^[0-9a-f]{64}$ ]]
          test -n "$ID_READBACK"
          test -n "$NAME_READBACK"
          for path in "$ID_READBACK/$EXPECTED_NAME" "$NAME_READBACK"; do
            test -f "$path/artifact.tar"
            digest=$(sha256sum "$path/artifact.tar")
            test "${digest%% *}" = "$EXPECTED_TAR"
          done
      - name: Require current main inside deployment lock
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ github.sha }}
        run: |
          set -euo pipefail
          current=$(gh api repos/Living-Proof-Labs/livingproof-evaluator/git/ref/heads/main --jq .object.sha)
          test "$current" = "$CANDIDATE"
      - name: Deploy verified manual
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
